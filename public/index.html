<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005BBB">
    <meta name="description" content="Це справді так? - Ukrainian Flag PWA">
    <title>Це справді так?</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Wehende ukrainische Flagge -->
    <div class="flag-container">
        <svg class="flag" viewBox="0 0 1200 800" preserveAspectRatio="none">
            <defs>
                <filter id="wave">
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.003" numOctaves="3" seed="2">
                        <animate attributeName="baseFrequency" dur="8s" values="0.01 0.003;0.012 0.004;0.01 0.003" repeatCount="indefinite"/>
                    </feTurbulence>
                    <feDisplacementMap in="SourceGraphic" scale="40"/>
                </filter>
                <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#0057B8"/>
                    <stop offset="50%" style="stop-color:#005BBB"/>
                    <stop offset="100%" style="stop-color:#0057B8"/>
                </linearGradient>
                <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#FFD700"/>
                    <stop offset="50%" style="stop-color:#FFDD00"/>
                    <stop offset="100%" style="stop-color:#FFD700"/>
                </linearGradient>
            </defs>
            <g filter="url(#wave)">
                <rect x="0" y="0" width="1200" height="400" fill="url(#blueGradient)"/>
                <rect x="0" y="400" width="1200" height="400" fill="url(#yellowGradient)"/>
            </g>
        </svg>
    </div>

    <!-- Funkelnder Text -->
    <div class="text-container">
        <h1 class="floating-text" data-text="Це справді так?">
            <span class="rainbow-text">Це справді так?</span>
        </h1>
    </div>

    <!-- Funken-Container -->
    <div class="sparkles-container" id="sparkles"></div>

    <script src="/app.js"></script>
</body>
</html>
